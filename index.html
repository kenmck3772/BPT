<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Brahan 3D Forensic Terminal</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://cdn.plot.ly/plotly-2.27.0.min.js"></script>
  <style>
    body { margin: 0; background-color: #000; color: #00FF41; font-family: monospace; overflow: hidden; }
    .crt::before { content: " "; display: block; position: absolute; top: 0; left: 0; bottom: 0; right: 0; background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06)); z-index: 100; background-size: 100% 2px, 3px 100%; pointer-events: none; }
    .terminal { height: 40vh; padding: 20px; overflow-y: auto; text-shadow: 0 0 5px #00FF41; border-bottom: 1px solid #004411; }
    #plot-area { height: 60vh; width: 100%; }
  </style>
<script type="importmap">
{
  "imports": {
    "@google/genai": "https://esm.sh/@google/genai@^1.39.0",
    "react": "https://esm.sh/react@^19.2.4",
    "lucide-react": "https://esm.sh/lucide-react@^0.563.0",
    "html-to-image": "https://esm.sh/html-to-image@^1.11.13",
    "react/": "https://esm.sh/react@^19.2.4/",
    "plotly.js-dist-min": "https://esm.sh/plotly.js-dist-min@^3.3.1",
    "recharts": "https://esm.sh/recharts@^3.7.0",
    "jspdf": "https://esm.sh/jspdf@^4.0.0",
    "@playwright/test": "https://esm.sh/@playwright/test@^1.58.1"
  }
}
</script>
</head>
<body class="crt">
  <div id="root"></div>
  <script>
    const e = React.createElement;
    function App() {
      const [data, setData] = React.useState(null);

      React.useEffect(() => {
        fetch('https://storage.googleapis.com/run-sources-brahan-483303-us-central1/scraped-data/latest.json')
          .then(res => res.json())
          .then(json => {
            setData(json);
            renderPlot(json.geodetic_drift);
          });
      }, []);

      const renderPlot = (drift) => {
        const trace = {
          x: [0, drift], y: [0, drift], z: [0, -100],
          type: 'scatter3d', mode: 'lines+markers',
          line: { width: 6, color: '#00FF41' },
          marker: { size: 4, color: '#00FF41' }
        };
        const layout = {
          paper_bgcolor: 'black', plot_bgcolor: 'black',
          scene: {
            xaxis: {title: 'Easting', color: '#00FF41'},
            yaxis: {title: 'Northing', color: '#00FF41'},
            zaxis: {title: 'Depth', color: '#00FF41'}
          },
          margin: { l: 0, r: 0, b: 0, t: 0 }
        };
        Plotly.newPlot('plot-area', [trace], layout);
      };

      return e('div', null,
        e('div', { className: 'terminal' },
          e('h1', { className: 'text-xl glow' }, "BRAHAN FORENSIC SYSTEMS v4.0.1"),
          e('p', null, `STATUS: ONLINE [Jan 8 Stable]`),
          data && e('div', { className: 'mt-2' },
            e('p', null, `> ASSETS: ${data.records_count}`),
            e('p', null, `> DRIFT DETECTED: ${data.geodetic_drift}m`),
            e('p', null, `> CASING LEDGER: P-110 RECTIFIED`)
          )
        ),
        e('div', { id: 'plot-area' })
      );
    }
    ReactDOM.createRoot(document.getElementById('root')).render(e(App));
  </script>
</body>
</html>
